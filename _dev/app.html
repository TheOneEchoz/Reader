<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tankōbon Reader</title>
<meta name="theme-color" content="#0F1013">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --surface2:#E1E4EA; --ink:#14161B; --muted:#5B6270; --line:#D0D4DC;
  --accent:#D0382A; --accent-ink:#FFFFFF; --accent-soft:rgba(208,56,42,.12); --tone:rgba(20,22,27,.13);
  --ok:#2F7D4F; --shadow:0 1px 2px rgba(20,22,27,.08),0 6px 18px rgba(20,22,27,.08);
  --display:"Dela Gothic One","Arial Black",Impact,system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1013; --surface:#1A1C21; --surface2:#24272E; --ink:#ECEEF1; --muted:#9BA2AF; --line:#2D3139;
    --accent:#F2624C; --accent-ink:#160906; --accent-soft:rgba(242,98,76,.16); --tone:rgba(236,238,241,.08);
    --ok:#5FC08A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1013; --surface:#1A1C21; --surface2:#24272E; --ink:#ECEEF1; --muted:#9BA2AF; --line:#2D3139;
  --accent:#F2624C; --accent-ink:#160906; --accent-soft:rgba(242,98,76,.16); --tone:rgba(236,238,241,.08);
  --ok:#5FC08A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.reading{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{display:inline-flex;width:22px;height:22px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px;min-height:60px}
.appbar .grow{flex:1;min-width:0}
.appbar h1,.appbar h2{overflow-wrap:anywhere;margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark{font-family:var(--display);font-size:24px;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:10px}
.wordmark .hanko{flex:none;width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;font-family:var(--display);transform:rotate(-4deg)}
.sub{color:var(--muted);font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface2);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{color:var(--accent);background:var(--accent-soft)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-block:4px 12px}
.tone{background-image:radial-gradient(var(--tone) 1.1px,transparent 1.3px);background-size:7px 7px}

/* ---------- library ---------- */
.lib-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-block:6px 16px}
.search{flex:1 1 180px;min-width:0;height:42px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:22px 14px}
.libgridmain{padding-bottom:84px}
.card.sel .cwrap{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.lib-tools{position:sticky;top:0;z-index:6;background:var(--bg);padding-top:6px;padding-bottom:6px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.cover{position:relative;display:block;width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface2);box-shadow:var(--shadow)}
.cover img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cover .chip{position:absolute;left:8px;top:8px;background:rgba(10,11,13,.72);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em}
.cwrap{position:relative}
.card .play{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.card .play .ic{width:18px;height:18px}
.card h3{margin:0;font-size:14px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--muted);margin:0}
.bar{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.28);min-height:54px;padding:0 22px;font-size:15px}

/* ---------- detail ---------- */
.hero{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:end;margin-block:4px 18px}
.hero .cover{box-shadow:var(--shadow)}
.hero h1{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;margin:0 0 6px;text-wrap:balance;word-break:break-word}
.stack{display:grid;gap:14px}
.panel{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:12px}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.modes button{display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:10px;font-size:12px;font-weight:500;color:var(--muted);border:1.5px solid transparent;background:var(--surface2)}
.modes button .ic{width:26px;height:26px}
.modes button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft);font-weight:700}
.chlist{display:grid;background:var(--surface);border-radius:14px;overflow:hidden}
.chrow{display:grid;grid-template-columns:minmax(40px,auto) 1fr auto;gap:10px;align-items:center;padding:12px 14px;text-align:left;border-top:1px solid var(--line);min-height:56px;width:100%}
.chrow:first-child{border-top:0}
.chrow .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:13px}
.chrow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.chrow .s{font-size:12px;color:var(--muted);white-space:nowrap}
.chrow.read .t{color:var(--muted)}
.chrow.group .t{font-weight:700}
.chrow:disabled{opacity:.55}
.chrow.current{background:var(--accent-soft)}
.chrow.current .n{color:var(--accent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}

/* ---------- editor ---------- */
.field{display:grid;gap:6px}
.text{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;width:100%}
.edlist{display:grid;gap:8px}
.edrow{display:grid;grid-template-columns:30px minmax(26px,auto) 1fr auto auto;gap:6px;align-items:center;background:var(--surface);border-radius:12px;padding:6px 6px 6px 2px}
.edrow .grip{height:44px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none}
.edrow .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;font-weight:700;text-align:center}
.edrow input{height:40px;border:1px solid transparent;background:transparent;border-radius:8px;padding:0 8px;min-width:0;width:100%}
.edrow input:focus{border-color:var(--line);background:var(--bg)}
.sortable-ghost{opacity:.35}
.edrow.group input{font-weight:700}
.edrow.off{opacity:.55}

.twisty{width:30px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.twisty .ic{width:18px;height:18px;transition:transform .15s}
.twisty.open .ic{transform:rotate(90deg)}
.sortable-chosen{box-shadow:0 10px 28px rgba(0,0,0,.25)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pcell{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface2);border:3px solid transparent;user-select:none;-webkit-user-select:none}
.pcell img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;pointer-events:none}
.pcell .no{position:absolute;left:4px;bottom:4px;background:rgba(10,11,13,.75);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums}
.pcell .cv{position:absolute;right:4px;top:4px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;letter-spacing:.04em}
.pcell.sel{border-color:var(--accent)}
.pcell.folder{border-radius:4px 10px 10px 10px}
.pcell.carried{opacity:.3}
.pcell{-webkit-touch-callout:none}
.dragghost{position:fixed!important;left:0;top:0;z-index:90;pointer-events:none;margin:0;box-shadow:0 14px 34px rgba(0,0,0,.4);opacity:.95;border-color:var(--accent)!important}
.dragghost[data-count]::before{content:attr(data-count);position:absolute;right:4px;top:4px;z-index:3;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.dropmark{position:fixed;z-index:89;width:4px;border-radius:2px;background:var(--accent);pointer-events:none;box-shadow:0 0 0 2px var(--bg)}
.pcell.off img{opacity:.4;filter:grayscale(.6)}
.offmark{position:absolute;right:4px;bottom:4px;z-index:2;width:24px;height:24px;border-radius:6px;background:rgba(10,11,13,.75);color:#fff;display:grid;place-items:center}
.offmark .ic{width:15px;height:15px}
.pcell.folder .offmark{right:4px;top:4px;bottom:auto}
.pcell.folder.sel::after{background:linear-gradient(180deg,var(--accent-soft),rgba(10,11,13,.7))}
.pcell.droptarget{outline:3px dashed var(--accent);outline-offset:2px;transform:scale(1.06);transition:transform .12s}
.pcell[data-count]::before{content:attr(data-count);position:absolute;right:4px;top:4px;z-index:3;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.pcell.folder::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(10,11,13,.7))}
.pcell .bfold{left:4px;top:4px;bottom:auto;width:26px;height:26px}
.pcell .ftitle{position:absolute;left:6px;right:6px;bottom:5px;z-index:1;color:#fff;font-size:12px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcell.sel::after{content:"";position:absolute;inset:0;background:var(--accent-soft)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:18px;padding:8px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.35)}
.selbar b{padding:0 8px;font-size:14px}
.selname{display:grid;min-width:0;max-width:100%;padding:2px 8px;flex:1 1 100%;text-align:center}
.selname b{padding:0;word-break:break-all;line-height:1.3}
.selname span{font-size:11px;opacity:.7}
.selbar .btn{background:transparent;color:inherit;min-height:40px;padding:0 10px}
.selbar .btn.danger{color:#FF8A78;background:transparent}

/* ---------- sheet & toast ---------- */
#sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(5,6,8,.55)}
#sheet .sp{position:relative;background:var(--surface);color:var(--ink);width:min(640px,100%);max-height:86dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
#sheet header{display:flex;align-items:center;gap:8px;padding:10px 8px 6px 18px}
#sheet header h2{flex:1;margin:0;font-size:17px}
#sheet .sb{min-height:0;flex:1 1 auto;overflow:auto;padding:4px 18px 20px;display:grid;gap:16px;overscroll-behavior:contain}
.setrow{display:grid;gap:8px}
.setpage{gap:18px}
.setgroup{display:grid;gap:8px}
.setlist{display:grid;border-radius:14px;overflow:hidden;background:var(--surface2)}
.setitem{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%;min-height:58px;color:var(--ink);font:inherit}
.setitem+.setitem{border-top:1px solid var(--line)}
button.setitem:active{background:var(--line)}
.setitem>.ic{width:22px;height:22px;color:var(--muted)}
.setitem b{display:block;font-size:15px;font-weight:600}
.setitem small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.setitem.tall>span{display:grid;gap:6px}
.setitem.tall .seg{margin-top:4px;justify-self:start;flex-wrap:nowrap}
.setitem.tall .seg button{padding-inline:10px}
.setrow.inline{grid-template-columns:1fr auto;align-items:center}
.setrow .lab{font-weight:500;font-size:14px}
.switch{width:50px;height:30px;border-radius:999px;background:var(--surface2);position:relative;border:1.5px solid var(--line);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent-ink)}
input[type=range]{accent-color:var(--accent);width:100%}
.bigopt{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;background:var(--surface2);width:100%}
.bigopt .ic{width:28px;height:28px;color:var(--accent);justify-self:center}
.bigopt b{display:block}
.bigopt span{font-size:13px;color:var(--muted)}
.bigopt:disabled{opacity:.55}
.bigopt:disabled .ic{color:var(--muted)}
.progress{display:grid;gap:8px}
.progress .bar{height:6px}
.bgprog{position:fixed;left:12px;right:104px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:110;display:grid;gap:6px;pointer-events:none}
@media (min-width:640px){.bgprog{left:50%;right:auto;width:420px;transform:translateX(-50%)}}
.bgprog .task{background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:grid;gap:6px;font-size:13px;font-weight:600}
.bgprog .task .bar{height:5px;background:rgba(255,255,255,.18)}
.bgprog .task .bar i{background:var(--accent)}
.bgprog .task .bar.ind i{width:35%!important;animation:bgind 1.1s ease-in-out infinite}
@keyframes bgind{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
body.reading .bgprog{display:none}
#drophint{position:fixed;inset:12px;z-index:130;border:3px dashed var(--accent);border-radius:20px;background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;pointer-events:none}
#drophint[hidden]{display:none}
#drophint>div{display:grid;justify-items:center;gap:6px;text-align:center;padding:20px}
#drophint .ic{width:40px;height:40px;color:var(--accent)}
#drophint b{font-size:20px}
.betachip{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.06em;background:#7a4df0;color:#fff;border-radius:6px;padding:2px 6px;vertical-align:middle}
.askyes{position:fixed;inset:0;z-index:160;background:rgba(5,6,8,.55);display:grid;place-items:center;padding:16px}
.askbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;max-width:420px;width:100%;display:grid;gap:10px;box-shadow:var(--shadow)}
.askbox h3{margin:0;font-size:17px}
body:has(.selbar:not([hidden])) #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.undobar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:125;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.undobar .btn{background:var(--bg);color:var(--ink)}
body:has(.selbar:not([hidden])) .undobar{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body:has(#sheet:not([hidden])) #toast{top:calc(16px + env(safe-area-inset-top,0px));bottom:auto}
#sheet .sp.half{max-height:52dvh}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);pointer-events:none;transition:opacity .2s}
.hint{font-size:13px;color:var(--muted);margin:0}
#shield{position:fixed;inset:0;z-index:500;background:var(--bg);display:grid;place-items:center}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 10px}
.btile{display:grid;gap:6px;text-align:left;min-width:0;align-content:start}
.bthumb{position:relative;display:block;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface2);box-shadow:var(--shadow)}
.bthumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.btile.current .bthumb{outline:3px solid var(--accent);outline-offset:2px}
.btile.folder .bthumb{border-radius:4px 10px 10px 10px;box-shadow:4px -4px 0 -1px var(--surface),4px -4px 0 1px var(--line),var(--shadow);margin:4px 4px 0 0}
.btile.folder .bthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,11,13,.55))}
.bfold{position:absolute;left:6px;bottom:6px;z-index:1;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.bfold .ic{width:18px;height:18px}
.bchip{position:absolute;right:6px;top:6px;z-index:1;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;letter-spacing:.05em;border-radius:6px;padding:1px 6px}
.bchip.done{background:rgba(10,11,13,.7);color:#fff;display:inline-flex;align-items:center;gap:3px}
.bchip .ic{width:13px;height:13px}
.btile.off .bthumb img{opacity:.45;filter:grayscale(.6)}
.bcap{display:grid;gap:1px;font-size:12px;color:var(--muted);min-width:0}

/* ---------- reader ---------- */
#tapguide{position:absolute;inset:0;z-index:5;pointer-events:none;transition:opacity .6s}
#tapguide.out{opacity:0}
#tapguide .tg{position:absolute;display:grid;place-items:center;border:1.5px dashed rgba(255,255,255,.55)}
#tapguide .tg span{background:rgba(10,11,13,.8);color:#fff;font-weight:700;font-size:15px;padding:6px 12px;border-radius:999px}
#tapguide .next{background:rgba(214,64,52,.32)}
#tapguide .prev{background:rgba(70,110,200,.32)}
#tapguide .menu{background:rgba(255,255,255,.08)}
#reader{position:fixed;inset:0;z-index:50;background:#000;color:#fff;overflow:hidden;--rbg:#000}
#reader[data-bg="gray"]{--rbg:#2A2C30}
#reader[data-bg="white"]{--rbg:#F4F4F2}
#reader{background:var(--rbg)}
#warm{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#warm .spread{position:absolute;left:0;top:0;will-change:transform}
#stage{position:absolute;inset:0;z-index:1;background:var(--rbg);overflow:auto;scrollbar-width:none;touch-action:none;overscroll-behavior:contain}
#stage::-webkit-scrollbar{display:none}
#stage.t-y{touch-action:pan-y}
#stage.t-x{touch-action:pan-x}
#stage.t-xy{touch-action:pan-x pan-y}

.spread{display:flex;align-items:center;min-width:100%;min-height:100%;width:max-content;transform-origin:0 0;will-change:transform}
.spread.anim{transition:transform .2s ease-out}
.spread>*:first-child{margin-left:auto}
.spread>*:last-child{margin-right:auto}
.spread img{display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.spread.fit-screen img{max-width:100vw;max-height:100dvh;width:auto;height:auto;object-fit:contain}
.spread.fit-screen.n2 img{max-width:50vw}
.spread.fit-width img{width:100vw;height:auto}
.spread.fit-width.n2 img{width:50vw}
.spread.fit-height img{height:100dvh;width:auto}
.spread.fit-original img{max-width:none}
.spread img.ph{object-fit:fill}
.spread.tallfit img{width:100vw !important;max-width:100vw !important;height:auto !important;max-height:none !important}
#strip.sh:not(.zin){scroll-snap-type:x proximity}

async function rpyPutJSON(o, id) { id = id || uid(); await ST.put('images', { id, t: 'application/json', e: await Crypt.encJSON(o) }); return id; }

    let bm; try { bm = await createImageBitmap(new Blob([bytes])); } catch (e) { toast('That picture could not be read.'); return fin(null); }

    const zoomIn = h('input', { type: 'range', min: '1', max: '4', step: '0.01', value: '1', 'aria-label': 'Zoom' });

      h('p', { class: 'hint', style: 'margin:0;text-align:center' }, 'Drag the picture to move it; zoom with the slider, the mouse wheel or two fingers.'),

/* add save files (and the computer's save keys) to a game's saves. mine: [{path, blob()}] (only the file name is kept).
   Returns {n: saves added, undo()} or null if it failed. */
async function addSaves(gid, base, mine, keysF) {
  const g = await S.gal(gid); if (!isGame(g)) return null;
  const idx = (await rpyGetJSON(g.game.sv)) || {};
  busy++;
  try {
    const before = await savesSnapshot(gid); // to undo the import
    const files2 = [];
    for (const it of mine) files2.push({ p: base + it.path.split('/').pop(), buf: await (await it.blob()).arrayBuffer() });
    // the computer's signing keys: Ren'Py then trusts these saves without asking
    if (keysF) {
      const theirs = new TextDecoder().decode(await (await keysF.blob()).arrayBuffer());
      const kp = 'home/web_user/.renpy/tokens/security_keys.txt', have = idx[kp];
      let text;

        const cur = new TextDecoder().decode(await rpyRead(have.c, have.s));
        const add = theirs.split(/\r?\n/).map(l => l.trim().split(/\s+/)).filter(t => t[0] === 'signing-key' || t[0] === 'verifying-key')
          .map(t => 'verifying-key ' + (t[0] === 'signing-key' ? t[2] : t[1])).filter(l => l.split(' ')[1] && !cur.includes(l.split(' ')[1]));
        text = cur.replace(/\s*$/, '\n') + add.join('\n') + (add.length ? '\n' : '');
      }
      files2.push({ p: kp, buf: Crypt.te.encode(text).buffer });
    }
    // added to (not replacing) what the app already has
    for (const p of Object.keys(idx)) if (!files2.some(f => f.p === p)) files2.push({ p, buf: await rpyRead(idx[p].c, idx[p].s) });
    await persistSaves(gid, files2);
    return { n: mine.filter(it => /\.save$/i.test(it.path)).length, undo: () => restoreSaves(gid, before) };
  } catch (e) { toast('Could not import the saves: ' + (e.message || e), 4500); return null; }

}

      h('div', { class: 'setrow' }, h('div', { class: 'lab' }, 'Base picture'),
        seg([...(pages.length >= 3 ? [['common', 'What they all share']] : []), ...items.map((it, i) => [String(i), it.name])], baseMode, v => baseMode = v)),
      h('div', { class: 'setrow' }, h('div', { class: 'lab' }, 'Layers'),
        seg([['parts', 'Split into parts (hair, eyes…)'], ['whole', 'Whole versions']], split, v => split = v),
        h('p', { class: 'hint', style: 'margin:0' }, split === 'parts'

          : 'One layer per version with everything that is different about it.')),
      h('div', { class: 'setrow inline' }, h('div', {}, h('div', { class: 'lab' }, 'Understand see-through effects'), h('div', { class: 'hint' }, 'Shadows, blush, glows and tints become see-through layers, so they also look right over other layers. Solid additions stay solid.')),
        h('button', { class: 'switch', role: 'switch', id: 'var-see', 'aria-label': 'Understand see-through effects', 'aria-checked': String(seeThrough), onclick: e => { seeThrough = !seeThrough; e.currentTarget.setAttribute('aria-checked', String(seeThrough)); } })),
      h('div', { class: 'setrow' }, h('div', { class: 'lab' }, 'How small a change to catch'),
        seg([['less', 'Only clear changes'], ['normal', 'Normal'], ['more', 'Small changes too']], sens, v => sens = v),
        h('p', { class: 'hint', style: 'margin:0' }, 'Use “Only clear changes” for blurry or compressed images.')),

      ...pr.parts.map(pt => h('div', { class: 'stack', style: 'gap:6px' },
        h('div', { class: 'sub' }, h('b', {}, pt.name), ` · ${plural(pt.opts.length, 'option')}${pt.same.length ? ` + as in the base${pt.baseName ? ` (${pt.baseName})` : ''}` : ''}`),
        h('div', { class: 'vargrid' }, pt.opts.map(o => tile(o.chain.map(c => c.layer), o.name, (o.see > 50 ? 'See-through · ' : '') + (o.parent ? `Adds to ${o.parent.name} · in ${o.holders.map(i => res.variants[i].name).join(', ')}` : `In ${o.holders.map(i => res.variants[i].name).join(', ')}`)))))),
      h('div', { class: 'label' }, 'Versions, rebuilt from the base and their parts'),
      h('div', { class: 'vargrid' }, res.variants.map((v, i) => tile(pr.parts.flatMap(pt => { const o = pt.opts.find(o => o.members.includes(i)); return o ? o.chain.map(c => c.layer) : []; }), v.name, `Matches ${(100 * pr.match[i]).toFixed(1)}%`)))] : null;

      h('div', { class: 'row', style: 'align-items:center' }, h('span', { class: 'varthumb' }, VariantsOld.preview(res, [])),
        h('div', {}, h('b', {}, 'Base picture'), h('div', { class: 'sub' }, res.baseIdx >= 0 ? items[res.baseIdx].name : 'What all versions share'))),
      ...(partsView || [h('div', { class: 'label' }, 'Versions, rebuilt from the base and their layer'),
      h('div', { class: 'vargrid' }, res.variants.map(v => tile(v.layer ? [v.layer] : [], v.name, v.layer ? `${v.see > 50 ? 'See-through parts · ' : ''}Changes ${(100 * v.cover).toFixed(1)}% · matches ${(100 * v.match).toFixed(1)}%` : 'Same as the base')))]),
      big.length ? h('div', { class: 'banner', style: 'margin:0' }, `${big.map(v => v.name).join(', ')} ${big.length === 1 ? 'is' : 'are'} very different from the base. These may not be versions of the same picture.`) : '',
      h('div', { class: 'setrow inline' }, h('span', { class: 'lab' }, 'Keep the original images (hidden from reading)'),
        h('button', { class: 'switch', role: 'switch', 'aria-checked': String(keep), onclick: e => { keep = !keep; e.currentTarget.setAttribute('aria-checked', String(keep)); } })),
      h('div', { class: 'row', style: 'flex-wrap:wrap' },
        h('button', { class: 'btn primary', id: 'var-make', onclick: make }, icon('layers'), 'Make the layered image'),
        h('button', { class: 'btn ghost', onclick: stage1 }, 'Change the settings')));
  };

    box.replaceChildren(h('div', { class: 'progress' }, h('div', { class: 'num' }, 'Saving the layers…'), h('div', { class: 'bar ind' }, h('i', { style: 'width:35%' }))));

    try {
      // always a new image, placed before the first version; the versions themselves are not used up
      let baseId;
      // layers the chosen images already had come along as copies (so deleting an original never takes them away)
      const old = [];
      for (const it of items) { const O = Lay.of(g, it.id); old.push(O ? await copyLayerSet(g, O) : null); }
      if (res.baseIdx >= 0) { baseId = await copyImage(g, items[res.baseIdx].id, items[0].name + ' (layered)'); }
      else {
        const b = await VariantsOld.blobOf(res.base, 'image/webp', .97) || await VariantsOld.blobOf(res.base);
        const t = await makeThumb(b); baseId = uid();
        await S.putBlob('images', baseId, b); await S.putBlob('thumbs', baseId, t.thumb);
        g.meta[baseId] = [res.W, res.H, items[0].name + ' (layered).webp'];
      }
      { const c0 = g.chapters.find(c => c.pages.includes(items[0].id)); c0.pages.splice(c0.pages.indexOf(items[0].id), 0, baseId); }
      const L = Lay.ensure(g, baseId); L.list = []; L.on = []; L.presets = [];
      // split into parts: one layer per option, a pick-one group per part
      const partOn = res.variants.map(() => []);
      if (pr) L.baseNames = Object.fromEntries(pr.parts.filter(pt => pt.baseName).map(pt => [pt.name.toLowerCase(), pt.baseName]));
      if (pr) for (const pt of pr.parts) for (const o of pt.opts) {
        const b = await VariantsOld.blobOf(o.layer), t = await makeThumb(b), lid = uid(), nm = o.name;
        await S.putBlob('images', lid, b); await S.putBlob('thumbs', lid, t.thumb);
        g.meta[lid] = [res.W, res.H, `${pt.name} ${nm}.png`];
        L.list.push({ id: lid, name: nm.length > 40 ? nm.slice(0, 38) + '…' : nm, group: pt.name, ...(keep ? { src: o.members.map(i => items[i].id) } : {}) });
        o.lid = lid;
      }
      if (pr) for (const pt of pr.parts) for (const o of pt.opts) o.members.forEach(i => o.chain.forEach(c => partOn[i].push(c.lid)));
      for (const [k, v] of res.variants.entries()) {
        let on = [];

          const b = await VariantsOld.blobOf(v.layer), t = await makeThumb(b), lid = uid();
          await S.putBlob('images', lid, b); await S.putBlob('thumbs', lid, t.thumb);
          g.meta[lid] = [res.W, res.H, v.name + '.png'];

        for (const l of O.list) if (!L.list.some(x => x.id === l.id)) L.list.push({ ...l });

    } catch (e) { console.error(e); toast('Could not save: ' + (e.message || e), 4500); stage2(); }
    finally { busy = Math.max(0, busy - 1); }
  };

/* ================= full-size image viewer =================

async function openViewer(title, views) {

  const key = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };

    h('header', {}, h('b', {}, title), h('button', { class: 'iconbtn', 'aria-label': 'Close', onclick: close }, icon('x'))),
    seg ? h('div', { class: 'vwbar' }, seg) : null, stage, note);

    cur = i; if (seg) $$('button', seg).forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
    stage.classList.toggle('see', !!views[i].see);

/* Where a layer came from, for layers made before this was remembered: pages in the gallery named like the layer,

function guessSource(g, baseId, l) {
  const L = Lay.of(g, baseId); if (!L) return [];
  const names = new Set([l.name, ...L.presets.filter(p => p.on.includes(l.id)).map(p => p.name.split(' · ')[0])].map(x => x.toLowerCase()));
  // look next to the layered image first (the originals are put right after it), then in the whole gallery
  const find = pages => pages.filter(pid => pid !== baseId && names.has(Lay.nameOf(g, pid).toLowerCase()));
  const home = g.chapters.find(c => c.pages.includes(baseId));
  const near = home ? find(home.pages) : [];

/* a layer on its own, on the base, or on a faded base so the change stands out */
function viewLayer(g, baseId, layerId, name, src) {
  const [w, hh] = g.meta[baseId] || [1000, 1400];
  const draw = async fade => {
    const [bb, lb] = await Promise.all([S.blob('images', baseId), S.blob('images', layerId)]); if (!lb) return null;
    const c = document.createElement('canvas'); c.width = w; c.height = hh; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, w, hh);
    if (bb) { const bi = await decodeImg(bb); x.globalAlpha = fade ? .25 : 1; x.drawImage(bi, 0, 0, w, hh); x.globalAlpha = 1; if (bi.close) bi.close(); }
    const li = await decodeImg(lb); x.drawImage(li, 0, 0, w, hh); if (li.close) li.close();

  openViewer(name, [
    { label: 'What changes', make: () => draw(true) },
    { label: 'On the base', make: () => draw(false) },
    { label: 'Layer alone', make: () => S.blob('images', layerId), see: true },
    // the image(s) the layer was taken from, while they are still in the gallery
    ...(src || []).filter(x => g.meta[x]).slice(0, 4).map((x, i, a) => ({ label: a.length > 1 ? `Original: ${Lay.nameOf(g, x)}` : 'Original image', make: () => S.blob('images', x) }))]);
}

/* Save a file into Documents/Tankobon on the phone (the app's own folder if Android refuses). */
async function saveFileNative(blob, name) {
  if (DESK) return TkbDesktop.saveFile(name, new Uint8Array(await blob.arrayBuffer()));
  const F = Nat('Filesystem'), CH = 3 * 1024 * 1024;
  try { await F.requestPermissions(); } catch (e) { }
  const write = async (directory, path) => {
    for (let off = 0; off < blob.size || off === 0; off += CH) {
      const data = u8ToB64(new Uint8Array(await blob.slice(off, off + CH).arrayBuffer()));
      if (off === 0) await F.writeFile({ path, data, directory, recursive: true }); else await F.appendFile({ path, data, directory });
      if (blob.size === 0) break;
    }
  };
  const stamp = name.replace(/(\.[^.]+)$/, ` ${new Date().toISOString().slice(0, 16).replace(/[T:]/g, '-')}$1`);
  for (const [dir, label] of [['DOCUMENTS', 'Documents › Tankobon'], ['EXTERNAL', 'Android › data › io.github.theoneechoz.tankobon › files › Tankobon']]) {
    for (const nm of [name, stamp]) { try { await write(dir, 'Tankobon/' + nm); return `${label} › ${nm}`; } catch (e) { console.warn('save', dir, e); } }
  }
  throw new Error('Android did not allow saving the file');
}

(async function boot() {
  await DB.open();
  try { const d = await DB.get('meta', 'defaults'); if (d) GLOBAL = { ...DEFAULTS, ...d.v }; const u = await DB.get('meta', 'ui'); if (u) UI = { ...UI, ...u.v }; } catch (e) { }
  // the website: open the version (normal / experimental) this device chose
  if (!NATIVE && (await Channel.load()) !== APP_CHANNEL && !/[?&]stay/.test(location.search)) {
    const to = Channel.cur === 'beta' ? 'beta/' : '../';
    // only go if the other version is really there (for example while offline it may not be)
    let ok = false; try { ok = (await fetch(to + 'version.json', { cache: 'no-store' })).ok; } catch (e) { }
    if (ok) { location.replace(to); return; }
    await Channel.set(APP_CHANNEL);
  }
  if (NATIVE) {
    try { await NFS.init(); } catch (e) { console.error(e); }
    if (await Upd.boot().catch(e => { console.error(e); return false; })) return; // switching to a downloaded version
    if (ANDROID) {
    // Android pauses the app instead of hiding the page: lock and cover the same way
    const onPause = () => { hiddenAt = Date.now(); if (UI.shield !== false) $('#shield').hidden = false; if (CUR.view === 'reader') saveProgress(true); };
    const onResume = () => {
      if (Crypt.ready && hiddenAt && !busy && Date.now() - hiddenAt >= lockAfterSecs() * 1000) return lockNow();
      hiddenAt = 0; setTimeout(() => { $('#shield').hidden = true; }, 60); nativeScreen(); Upd.check(false);
    };
    try { Nat('App').addListener('appStateChange', st => st.isActive ? onResume() : onPause()); }
    catch (e) { document.addEventListener('pause', onPause); document.addEventListener('resume', onResume); }
    }
    if (DESK) await restoreLockFromFolder();
  }
  await Sync.load();
  listenIncoming();
  let locks = []; try { locks = await allLocks(); } catch (e) { }
  if (locks.length) showUnlock(locks);
  else {
    // a pairing that was started but not finished (the app was closed before the password was chosen)
    const pj = await DB.get('meta', 'pendingJoin').catch(() => null);
    if (pj && Date.now() - pj.t < 30 * 60 * 1000) { showSetup(b64ToU8(pj.raw)); setTimeout(() => toast('Your pairing is still waiting: choose a username and password to finish it.', 5000), 300); }
    else { if (pj) DB.del('meta', 'pendingJoin').catch(() => { }); showSetup(); }
  }
})();
</script>
<script>if ('serviceWorker' in navigator && !NATIVE) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
