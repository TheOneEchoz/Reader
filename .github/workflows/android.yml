name: Android app

on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Put the web app inside the Android project
        run: |
          cd android-app
          npm ci
          rm -rf www && mkdir www
          cp ../index.html ../*.js ../*.png ../manifest.webmanifest ../version.json www/
          rm -f www/sw.js
          npx cap sync android

      - name: Build the app file
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          export VERSION_NAME="$(python3 -c "import json;print(json.load(open('version.json'))['name'])")"
          cd android-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../../build.log
          cp app/build/outputs/apk/release/app-release.apk ../../Tankobon.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Tankōbon Android app (build ${{ github.run_number }})
          body: Download Tankobon.apk on your phone and open it to install. Later screen updates arrive inside the app.
          files: Tankobon.apk
          make_latest: true

      - name: Save the build log
        if: always()
        run: |
          mkdir -p /tmp/ci && cp build.log /tmp/ci/ 2>/dev/null || true
          { echo "run ${{ github.run_number }}"; echo "status ${{ job.status }}"; ls -la Tankobon.apk 2>&1; } > /tmp/ci/status.txt
          cd /tmp/ci && git init -q && git checkout -q -b ci-log && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.run_number }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log
