<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tankōbon Reader</title>
<meta name="theme-color" content="#0F1013">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --surface2:#E1E4EA; --ink:#14161B; --muted:#5B6270; --line:#D0D4DC;
  --accent:#D0382A; --accent-ink:#FFFFFF; --accent-soft:rgba(208,56,42,.12); --tone:rgba(20,22,27,.13);
  --ok:#2F7D4F; --shadow:0 1px 2px rgba(20,22,27,.08),0 6px 18px rgba(20,22,27,.08);
  --display:"Dela Gothic One","Arial Black",Impact,system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1013; --surface:#1A1C21; --surface2:#24272E; --ink:#ECEEF1; --muted:#9BA2AF; --line:#2D3139;
    --accent:#F2624C; --accent-ink:#160906; --accent-soft:rgba(242,98,76,.16); --tone:rgba(236,238,241,.08);
    --ok:#5FC08A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1013; --surface:#1A1C21; --surface2:#24272E; --ink:#ECEEF1; --muted:#9BA2AF; --line:#2D3139;
  --accent:#F2624C; --accent-ink:#160906; --accent-soft:rgba(242,98,76,.16); --tone:rgba(236,238,241,.08);
  --ok:#5FC08A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.reading{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{display:inline-flex;width:22px;height:22px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px;min-height:60px}
.appbar .grow{flex:1;min-width:0}
.appbar h1,.appbar h2{margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark{font-family:var(--display);font-size:24px;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:10px}
.wordmark .hanko{flex:none;width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;font-family:var(--display);transform:rotate(-4deg)}
.sub{color:var(--muted);font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface2);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{color:var(--accent);background:var(--accent-soft)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-block:4px 12px}
.tone{background-image:radial-gradient(var(--tone) 1.1px,transparent 1.3px);background-size:7px 7px}

/* ---------- library ---------- */
.lib-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-block:6px 16px}
.search{flex:1 1 180px;min-width:0;height:42px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:22px 14px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.cover{position:relative;display:block;width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface2);box-shadow:var(--shadow)}
.cover img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cover .chip{position:absolute;left:8px;top:8px;background:rgba(10,11,13,.72);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em}
.cwrap{position:relative}
.card .play{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.card .play .ic{width:18px;height:18px}
.card h3{margin:0;font-size:14px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--muted);margin:0}
.bar{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.28);min-height:54px;padding:0 22px;font-size:15px}

/* ---------- detail ---------- */
.hero{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:end;margin-block:4px 18px}
.hero .cover{box-shadow:var(--shadow)}
.hero h1{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;margin:0 0 6px;text-wrap:balance;word-break:break-word}
.stack{display:grid;gap:14px}
.panel{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:12px}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.modes button{display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:10px;font-size:12px;font-weight:500;color:var(--muted);border:1.5px solid transparent;background:var(--surface2)}
.modes button .ic{width:26px;height:26px}
.modes button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft);font-weight:700}
.chlist{display:grid;background:var(--surface);border-radius:14px;overflow:hidden}
.chrow{display:grid;grid-template-columns:minmax(40px,auto) 1fr auto;gap:10px;align-items:center;padding:12px 14px;text-align:left;border-top:1px solid var(--line);min-height:56px;width:100%}
.chrow:first-child{border-top:0}
.chrow .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:13px}
.chrow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.chrow .s{font-size:12px;color:var(--muted);white-space:nowrap}
.chrow.read .t{color:var(--muted)}
.chrow.group .t{font-weight:700}
.chrow:disabled{opacity:.55}
.chrow.current{background:var(--accent-soft)}
.chrow.current .n{color:var(--accent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}

/* ---------- editor ---------- */
.field{display:grid;gap:6px}
.text{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;width:100%}
.edlist{display:grid;gap:8px}
.edrow{display:grid;grid-template-columns:30px minmax(26px,auto) 1fr auto auto;gap:6px;align-items:center;background:var(--surface);border-radius:12px;padding:6px 6px 6px 2px}
.edrow .grip{height:44px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none}
.edrow .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;font-weight:700;text-align:center}
.edrow input{height:40px;border:1px solid transparent;background:transparent;border-radius:8px;padding:0 8px;min-width:0;width:100%}
.edrow input:focus{border-color:var(--line);background:var(--bg)}
.sortable-ghost{opacity:.35}
.edrow.group input{font-weight:700}
.edrow.off{opacity:.55}

.twisty{width:30px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.twisty .ic{width:18px;height:18px;transition:transform .15s}
.twisty.open .ic{transform:rotate(90deg)}
.sortable-chosen{box-shadow:0 10px 28px rgba(0,0,0,.25)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pcell{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface2);border:3px solid transparent;user-select:none;-webkit-user-select:none}
.pcell img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;pointer-events:none}
.pcell .no{position:absolute;left:4px;bottom:4px;background:rgba(10,11,13,.75);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums}
.pcell .cv{position:absolute;right:4px;top:4px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;letter-spacing:.04em}
.pcell.sel{border-color:var(--accent)}
.pcell.folder{border-radius:4px 10px 10px 10px}
.pcell.carried{opacity:.3}
.pcell{-webkit-touch-callout:none}
.dragghost{position:fixed!important;left:0;top:0;z-index:90;pointer-events:none;margin:0;box-shadow:0 14px 34px rgba(0,0,0,.4);opacity:.95;border-color:var(--accent)!important}
.dragghost[data-count]::before{content:attr(data-count);position:absolute;right:4px;top:4px;z-index:3;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.dropmark{position:fixed;z-index:89;width:4px;border-radius:2px;background:var(--accent);pointer-events:none;box-shadow:0 0 0 2px var(--bg)}
.pcell.off img{opacity:.4;filter:grayscale(.6)}
.offmark{position:absolute;right:4px;bottom:4px;z-index:2;width:24px;height:24px;border-radius:6px;background:rgba(10,11,13,.75);color:#fff;display:grid;place-items:center}
.offmark .ic{width:15px;height:15px}
.pcell.folder .offmark{right:4px;top:4px;bottom:auto}
.pcell.folder.sel::after{background:linear-gradient(180deg,var(--accent-soft),rgba(10,11,13,.7))}
.pcell.droptarget{outline:3px dashed var(--accent);outline-offset:2px;transform:scale(1.06);transition:transform .12s}
.pcell[data-count]::before{content:attr(data-count);position:absolute;right:4px;top:4px;z-index:3;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.pcell.folder::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(10,11,13,.7))}
.pcell .bfold{left:4px;top:4px;bottom:auto;width:26px;height:26px}
.pcell .ftitle{position:absolute;left:6px;right:6px;bottom:5px;z-index:1;color:#fff;font-size:12px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcell.sel::after{content:"";position:absolute;inset:0;background:var(--accent-soft)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:18px;padding:8px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.35)}
.selbar b{padding:0 8px;font-size:14px}
.selname{display:grid;min-width:0;max-width:100%;padding:2px 8px;flex:1 1 100%;text-align:center}
.selname b{padding:0;word-break:break-all;line-height:1.3}
.selname span{font-size:11px;opacity:.7}
.selbar .btn{background:transparent;color:inherit;min-height:40px;padding:0 10px}
.selbar .btn.danger{color:#FF8A78;background:transparent}

/* ---------- sheet & toast ---------- */
#sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(5,6,8,.55)}
#sheet .sp{position:relative;background:var(--surface);color:var(--ink);width:min(640px,100%);max-height:86dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
#sheet header{display:flex;align-items:center;gap:8px;padding:10px 8px 6px 18px}
#sheet header h2{flex:1;margin:0;font-size:17px}
#sheet .sb{min-height:0;flex:1 1 auto;overflow:auto;padding:4px 18px 20px;display:grid;gap:16px;overscroll-behavior:contain}
.setrow{display:grid;gap:8px}
.setrow.inline{grid-template-columns:1fr auto;align-items:center}
.setrow .lab{font-weight:500;font-size:14px}
.switch{width:50px;height:30px;border-radius:999px;background:var(--surface2);position:relative;border:1.5px solid var(--line);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent-ink)}
input[type=range]{accent-color:var(--accent);width:100%}
.bigopt{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;background:var(--surface2);width:100%}
.bigopt .ic{width:28px;height:28px;color:var(--accent);justify-self:center}
.bigopt b{display:block}
.bigopt span{font-size:13px;color:var(--muted)}
.progress{display:grid;gap:8px}
.progress .bar{height:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);pointer-events:none;transition:opacity .2s}
.hint{font-size:13px;color:var(--muted);margin:0}
#shield{position:fixed;inset:0;z-index:500;background:var(--bg);display:grid;place-items:center}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 10px}
.btile{display:grid;gap:6px;text-align:left;min-width:0;align-content:start}
.bthumb{position:relative;display:block;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface2);box-shadow:var(--shadow)}
.bthumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.btile.current .bthumb{outline:3px solid var(--accent);outline-offset:2px}
.btile.folder .bthumb{border-radius:4px 10px 10px 10px;box-shadow:4px -4px 0 -1px var(--surface),4px -4px 0 1px var(--line),var(--shadow);margin:4px 4px 0 0}
.btile.folder .bthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,11,13,.55))}
.bfold{position:absolute;left:6px;bottom:6px;z-index:1;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.bfold .ic{width:18px;height:18px}
.bchip{position:absolute;right:6px;top:6px;z-index:1;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;letter-spacing:.05em;border-radius:6px;padding:1px 6px}
.bchip.done{background:rgba(10,11,13,.7);color:#fff;display:inline-flex;align-items:center;gap:3px}
.bchip .ic{width:13px;height:13px}
.btile.off .bthumb img{opacity:.45;filter:grayscale(.6)}
.bcap{display:grid;gap:1px;font-size:12px;color:var(--muted);min-width:0}
.bcap b{color:var(--ink);font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:13px;color:var(--muted)}
.crumbs button{color:var(--accent);font-weight:500;padding:4px 0}
.crumbs b{color:var(--ink)}
.coverrow{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:start;background:var(--surface);border-radius:14px;padding:12px}
#v-lock{padding-inline:16px}
.lockbox{max-width:420px;margin:0 auto;padding-block:10vh 48px;display:grid;gap:16px}
.lockbox h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2;margin:8px 0 0;text-wrap:balance}
.err{color:var(--accent);font-size:14px;font-weight:500;min-height:1.2em;margin:0}
.wordmark{white-space:nowrap;overflow:hidden}
@media (max-width:440px){.wordmark{font-size:20px;gap:8px}.wordmark .hanko{width:24px;height:24px;font-size:13px}.appbar .btn.small{padding:0 10px}}
.syncpill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:700;white-space:nowrap}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sdot.waiting{background:#D69A1E}.sdot.connected{background:var(--ok)}.sdot.unavailable{background:var(--accent)}
.qrbox{display:grid;place-items:center}
.qrbox svg{width:min(260px,72vw);height:auto;background:#fff;border-radius:12px}
.code{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--surface2);padding:10px 12px;border-radius:8px;font-size:13px;user-select:all}
.scanvid{width:100%;max-height:48dvh;border-radius:12px;background:#000;object-fit:cover}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.checks .mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.checks .ok .mark{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.checks .bad .mark{background:var(--accent-soft);color:var(--accent)}
.checks b{font-weight:500;font-size:14px}
.report{white-space:pre-wrap;word-break:break-all;font-size:11px;background:var(--surface2);padding:10px;border-radius:8px;user-select:all}
.danger-zone{border:1.5px solid var(--accent-soft);border-radius:14px;padding:14px;display:grid;gap:10px}

/* ---------- reader ---------- */
#reader{position:fixed;inset:0;z-index:50;background:#000;color:#fff;overflow:hidden;--rbg:#000}
#reader[data-bg="gray"]{--rbg:#2A2C30}
#reader[data-bg="white"]{--rbg:#F4F4F2}
#reader{background:var(--rbg)}
#warm{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#warm .spread{position:absolute;left:0;top:0;will-change:transform}
#stage{position:absolute;inset:0;z-index:1;background:var(--rbg);overflow:auto;scrollbar-width:none;touch-action:none;overscroll-behavior:contain}
#stage::-webkit-scrollbar{display:none}
#stage.t-y{touch-action:pan-y}
#stage.t-x{touch-action:pan-x}
#stage.t-xy{touch-action:pan-x pan-y}
#stage.zoomed{overflow:hidden;touch-action:none}
.spread{display:flex;align-items:center;min-width:100%;min-height:100%;width:max-content;transform-origin:0 0;will-change:transform}
.spread.anim{transition:transform .2s ease-out}
.spread>*:first-child{margin-left:auto}
.spread>*:last-child{margin-right:auto}

#strip.sh .pg{align-self:safe center}
#strip.sh.zin{overflow-y:auto}

#strip .sep{flex:none;display:grid;place-items:center;gap:2px;text-align:center;padding:28px 16px;color:#9aa0aa;font-size:13px}

  const add = c => { if (c == null || c === false) return; if (Array.isArray(c)) c.forEach(add); else el.append(c.nodeType ? c : String(c)); };
  kids.forEach(add);

const ICONS = {

function ago(t) {
  if (!t) return 'Not started';
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'Read just now';
  if (s < 3600) return `Read ${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `Read ${Math.floor(s / 3600)} h ago`;

/* ================= storage ================= */
const DB = (() => {
  const STORES = ['galleries', 'images', 'thumbs', 'meta'];
  let db = null, mem = null;
  async function open() {
    try {
      if (!('indexedDB' in window)) throw new Error('no idb');
      db = await new Promise((res, rej) => {
        const r = indexedDB.open('tankobon', 1);
        r.onupgradeneeded = () => { for (const s of STORES) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
      return true;
    } catch (e) { mem = Object.fromEntries(STORES.map(s => [s, new Map()])); return false; }
  }
  function run(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const s = t.objectStore(store); let out;
      const r = fn(s); if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('aborted'));
    });
  }
  return {
    open, get memory() { return !!mem; },
    get: (s, id) => mem ? Promise.resolve(mem[s].get(id)) : run(s, 'readonly', st => st.get(id)),
    put: (s, o) => mem ? (mem[s].set(o.id, o), Promise.resolve()) : run(s, 'readwrite', st => st.put(o)),
    del: (s, id) => mem ? (mem[s].delete(id), Promise.resolve()) : run(s, 'readwrite', st => st.delete(id)),
    all: s => mem ? Promise.resolve([...mem[s].values()]) : run(s, 'readonly', st => st.getAll()),
    delMany: (s, ids) => mem ? (ids.forEach(i => mem[s].delete(i)), Promise.resolve()) : run(s, 'readwrite', st => { ids.forEach(i => st.delete(i)); }),
    keys: s => mem ? Promise.resolve([...mem[s].keys()]) : run(s, 'readonly', st => st.getAllKeys()),
    nuke: () => new Promise(res => { try { if (db) db.close(); const r = indexedDB.deleteDatabase('tankobon'); r.onsuccess = r.onerror = r.onblocked = () => res(); } catch (e) { res(); } }),
  };
})();

/* object-URL cache for image blobs */
const URLS = new Map(), PENDING = new Map(), PIN = new Set();
function imgURL(id, store = 'images') {
  const key = store[0] + id;
  if (URLS.has(key)) { const u = URLS.get(key); URLS.delete(key); URLS.set(key, u); return Promise.resolve(u); }
  if (PENDING.has(key)) return PENDING.get(key);
  const p = S.blob(store, id).then(b => {
    PENDING.delete(key);
    if (!b) return null;
    const u = URL.createObjectURL(b); URLS.set(key, u);
    const max = 420; // keep thumbnails and nearby pages alive
    if (URLS.size > max) for (const [k, v] of URLS) { if (URLS.size <= max - 40) break; if (k[0] === 'i' && !PIN.has(k.slice(1))) { URLS.delete(k); URL.revokeObjectURL(v); } }
    return u;
  }).catch(() => { PENDING.delete(key); return null; });
  PENDING.set(key, p); return p;
}
function forgetURL(id) { for (const s of ['i', 't']) { const k = s + id; if (URLS.has(k)) { URL.revokeObjectURL(URLS.get(k)); URLS.delete(k); } } }

/* ================= settings ================= */
const DEFAULTS = { mode: 'single', dir: 'ltr', fit: 'screen', coverAlone: true, gap: 0, stripWidth: 100, bg: 'black', dim: 0, tapZones: true, invertTaps: false, dblTapScale: 2.5, keepZoomPos: true, zoom: 1, pagedZoom: 1, pageNumber: true, keepAwake: true, chapterBreaks: true };
let GLOBAL = { ...DEFAULTS }, UI = { libSort: 'recent' };
const paged = m => m === 'single' || m === 'double';
const FIELDS = [
  { k: 'mode', label: 'Page layout', type: 'seg', opts: [['single', 'One page'], ['double', 'Two pages'], ['vertical', 'Vertical'], ['horizontal', 'Horizontal']] },

  { k: 'chapterBreaks', label: 'Show chapter titles between chapters', type: 'bool', when: p => !paged(p.mode) },
  { k: 'bg', label: 'Background', type: 'seg', opts: [['black', 'Black'], ['gray', 'Gray'], ['white', 'White']] },
  { k: 'dim', label: 'Dim pages', type: 'range', min: 0, max: 70, step: 5, unit: '%' },
  { k: 'tapZones', label: 'Tap the screen edges to turn pages', type: 'bool' },
  { k: 'invertTaps', label: 'Swap the left and right tap zones', type: 'bool', when: p => p.tapZones && p.mode !== 'vertical' },
  { k: 'dblTapScale', label: 'Double-tap zooms to', type: 'seg', group: 'zoom', opts: [[0, 'Off'], [1.5, '150%'], [2, '200%'], [2.5, '250%'], [3, '300%']] },
  { k: 'keepZoomPos', label: 'Keep the zoom and position when turning pages', type: 'bool', group: 'zoom', when: p => paged(p.mode) },
  { k: 'pageNumber', label: 'Show the page number', type: 'bool' },

async function saveMeta() { try { await DB.put('meta', { id: 'defaults', v: GLOBAL }); await DB.put('meta', { id: 'ui', v: UI }); } catch (e) { } }

function settingsForm(values, onChange, filter) {
  const box = h('div', { class: 'stack' });
  const draw = () => {
    box.replaceChildren();
    for (const f of FIELDS) {
      if (f.when && !f.when(values)) continue;
      if (filter && !filter(f)) continue;
      const id = 'set-' + f.k;
      if (f.type === 'seg') {
        box.append(h('div', { class: 'setrow' }, h('div', { class: 'lab', id }, f.label),
          h('div', { class: 'seg', role: 'group', 'aria-labelledby': id }, f.opts.map(([v, l]) => h('button', {
            'aria-pressed': String(values[f.k] == v), onclick: () => { values[f.k] = v; onChange(f.k, v); draw(); }
          }, l)))));
      } else if (f.type === 'bool') {
        box.append(h('div', { class: 'setrow inline' }, h('label', { class: 'lab', for: id }, f.label),
          h('button', { class: 'switch', id, role: 'switch', 'aria-checked': String(!!values[f.k]), onclick: () => { values[f.k] = !values[f.k]; onChange(f.k, values[f.k]); draw(); } })));
      } else if (f.type === 'range') {
        const out = h('span', { class: 'num sub' }, values[f.k] + f.unit);
        box.append(h('div', { class: 'setrow' }, h('div', { class: 'row', style: 'justify-content:space-between' }, h('label', { class: 'lab', for: id }, f.label), out),
          h('input', { type: 'range', id, min: f.min, max: f.max, step: f.step, value: values[f.k], oninput: e => { values[f.k] = +e.target.value; out.textContent = values[f.k] + f.unit; onChange(f.k, values[f.k]); } })));
      }
    }
  };
  draw(); return box;
}

/* ================= sheet ================= */
let sheetOnClose = null;
function openSheet(title, body, onClose) {

/* ================= encryption ================= */
const Crypt = (() => {
  const te = new TextEncoder(), td = new TextDecoder();
  let key = null, raw = null;
  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64u = u8 => b64(u8).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64u = s => unb64(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
  const importKey = u8 => crypto.subtle.importKey('raw', u8, 'AES-GCM', false, ['encrypt', 'decrypt']);
  async function kdf(pw, salt, iter) {
    const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function enc(buf, k = key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, buf);
    const out = new Uint8Array(12 + ct.byteLength); out.set(iv); out.set(new Uint8Array(ct), 12); return out.buffer;
  }
  async function dec(buf, k = key) {
    const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(0, 12) }, k, u.subarray(12));
  }
  return {
    get ready() { return !!key; }, get raw() { return raw; }, get key() { return key; },
    b64u, unb64u, importKey, enc, dec, te,
    async setRaw(u8) { raw = new Uint8Array(u8); key = await importKey(raw); },
    fresh() { return this.setRaw(crypto.getRandomValues(new Uint8Array(32))); },
    encJSON: o => enc(te.encode(JSON.stringify(o))),
    decJSON: async (b, k) => JSON.parse(td.decode(await dec(b, k || key))),
    async wrapRaw(u8, pw) {
      const salt = crypto.getRandomValues(new Uint8Array(16)), iter = 310000;
      return { id: 'lock', v: 1, salt: b64(salt), iter, data: b64(new Uint8Array(await enc(u8, await kdf(pw, salt, iter)))) };
    },
    async unwrapRaw(rec, pw) { return new Uint8Array(await dec(unb64(rec.data), await kdf(pw, unb64(rec.salt), rec.iter))); },
    async hash(label) {
      const d = await crypto.subtle.digest('SHA-256', new Uint8Array([...raw, ...te.encode(label)]));
      return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, '0')).join('');
    },
  };
})();

/* Encrypted records on top of IndexedDB. Galleries: {id, e}. Images/thumbs: {id, t: mime, e}. */
const S = {
  async open(r) { if (!r) return null; let g = r; if (r.e) { try { g = await Crypt.decJSON(r.e); } catch (e) { return null; } } if (g && g.chapters) Tree.ensureRoot(g); return g; },
  async gal(id) { return S.open(await DB.get('galleries', id)); },
  async gals() { const ids = await DB.keys('galleries'); return (await Promise.all(ids.map(S.gal))).filter(Boolean); },
  async putGal(g) { await DB.put('galleries', { id: g.id, e: await Crypt.encJSON(g) }); },
  async putBlob(store, id, blob) { await DB.put(store, { id, t: blob.type || 'image/jpeg', e: await Crypt.enc(await blob.arrayBuffer()) }); },
  async blob(store, id) {
    const r = await DB.get(store, id); if (!r) return null;
    if (r.blob) return r.blob;
    return new Blob([await Crypt.dec(r.e)], { type: r.t || 'image/jpeg' });
  },
};
/* Re-encrypt every record with newK. Unencrypted records get encrypted; records under oldK get moved to newK. */
async function reencrypt(oldK, newK, resume, onProg) {
  const stores = ['galleries', 'thumbs', 'images'];
  const all = []; for (const s of stores) (await DB.keys(s)).forEach(id => all.push([s, id]));
  let i = 0;
  for (const [store, id] of all) {
    i++; const r = await DB.get(store, id); if (!r) continue;
    let plain;
    if (!r.e) plain = store === 'galleries' ? Crypt.te.encode(JSON.stringify(r)) : await r.blob.arrayBuffer();
    else {
      if (!oldK) continue;
      if (resume) { try { await Crypt.dec(r.e, newK); continue; } catch (e) { } }
      try { plain = await Crypt.dec(r.e, oldK); } catch (e) { continue; }
    }
    const e = await Crypt.enc(plain, newK);
    await DB.put(store, store === 'galleries' ? { id, e } : { id, t: r.t || (r.blob && r.blob.type) || 'image/jpeg', e });
    if (onProg && (i % 5 === 0 || i === all.length)) onProg(i, all.length);
  }
}

async function exportZip(g) {
  if (typeof JSZip === 'undefined') return toast('The ZIP tool could not load. Check your connection and try again.', 3500);
  const total = totalPages(g); let done = 0, cancel = false;
  const lbl = h('div', { class: 'num' }, 'Preparing…'), bar = h('div', { class: 'bar' }, h('i', { style: 'width:0%' }));
  openSheet('Save as ZIP', h('div', { class: 'stack' },
    h('p', { class: 'hint' }, 'The ZIP is a normal copy of this gallery that any app can open, so it is not encrypted. Each chapter becomes a folder, in your order.'),
    h('div', { class: 'progress' }, lbl, bar), h('div', {}, h('button', { class: 'btn ghost small', onclick: () => { cancel = true; closeSheet(); } }, 'Stop'))), () => { cancel = true; });
  busy++;
  try {
    const zip = new JSZip();
    const pad = (n, l) => String(n).padStart(l, '0');
    const safe = s => (s || '').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '_').trim().slice(0, 80) || 'Untitled';
    const names = [], sib = [];
    for (const [ci, c] of g.chapters.entries()) {
      let folder = zip;
      if (!c.root) {
        const d = Tree.dep(c) - 1; sib.length = d + 1; sib[d] = (sib[d] || 0) + 1;
        names.length = d; names[d] = `${pad(sib[d], 2)} ${safe(c.title)}`;
        folder = zip.folder(names.slice(0, d + 1).join('/'));
      }
      for (const [pi, id] of c.pages.entries()) {
        if (cancel) throw new Error('stopped');
        const b = await S.blob('images', id); if (!b) continue;
        const nm = (g.meta[id] || [])[2] || '';
        const ext = ((nm.match(/\.[a-z0-9]{2,5}$/i) || [])[0] || '.' + ((b.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg'))).toLowerCase();
        folder.file(pad(pi + 1, 3) + ext, b, { binary: true });
        done++; lbl.textContent = `Adding page ${done.toLocaleString()} of ${total.toLocaleString()}`; bar.firstChild.style.width = (80 * done / total) + '%';
      }
    }
    if (g.customCover && g.cover === g.customCover) { const cb = await S.blob('images', g.customCover); if (cb) zip.file('cover' + (((g.meta[g.cover] || [])[2] || '').match(/\.[a-z0-9]+$/i) || ['.jpg'])[0].toLowerCase(), cb, { binary: true }); }
    lbl.textContent = 'Packing the ZIP…';
    const out = await zip.generateAsync({ type: 'blob', compression: 'STORE', streamFiles: true }, m => { bar.firstChild.style.width = (80 + m.percent * .2) + '%'; });
    if (cancel) throw new Error('stopped');
    const url = URL.createObjectURL(out);
    const a = h('a', { href: url, download: safe(g.title) + '.zip', style: 'display:none' }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 120000);
    closeSheet(); toast('ZIP saved. Look for it in your Downloads folder.', 4000);
  } catch (e) {
    if (e.message === 'stopped') toast('Stopped');
    else { console.error(e); toast('Could not create the ZIP: ' + (e.message || e), 4500); }
  } finally { busy--; }
}

    isStandalone() ? h('div', { class: 'banner' }, 'You are already using the installed app.') : null,
    h('ul', { class: 'checks' }, out.map(c => h('li', { class: c.ok ? 'ok' : 'bad' }, h('span', { class: 'mark', 'aria-hidden': 'true' }, c.ok ? '✓' : '✗'),
      h('div', {}, h('b', {}, c.label), c.ok ? null : h('p', { class: 'hint' }, c.fix))))),
    installEvt ? h('button', { class: 'btn primary', onclick: () => { closeSheet(); doInstall(); } }, icon('plus'), 'Install now') : null,
    h('p', { class: 'hint' }, 'If the first five lines are green, the app can be installed. Open Chrome\'s ⋮ menu and tap "Install and create shortcut" (older Chrome versions call it "Add to home screen" or "Install app"). If Tankōbon is already in your app drawer, it is already installed.'),
    h('div', { class: 'row' }, h('button', { class: 'btn ghost small', onclick: async () => {
      try { await navigator.clipboard.writeText(report); toast('Copied. Paste it in the chat with Claude.'); } catch (e) { pre.hidden = false; toast('Select the text below and copy it.'); }
    } }, 'Copy these results')),
    (pre = h('pre', { class: 'report', hidden: true }, report))].filter(Boolean));
}
let pre;

/* ================= boot ================= */
(async function boot() {
  await DB.open();
  try { const d = await DB.get('meta', 'defaults'); if (d) GLOBAL = { ...DEFAULTS, ...d.v }; const u = await DB.get('meta', 'ui'); if (u) UI = { ...UI, ...u.v }; } catch (e) { }
  await Sync.load();
  let lock = null; try { lock = await DB.get('meta', 'lock'); } catch (e) { }
  if (lock) showUnlock(lock); else showSetup();
})();
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
